[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-panel-executa"
version = "2.0.0"
description = "Placement Pakka 3-Agent LangGraph Executa Plugin (Schema v2) using reverse-RPC sampling/createMessage"
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Akshay Parimi" }
]
dependencies = [
  "pydantic>=1.10.0,<3.0.0",
  "langgraph>=0.2.0; python_version >= '3.10'",
  "langchain-core>=0.2.0; python_version >= '3.10'"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["executa_sdk*"]
